services:
  pramool-core:
    container_name: pramool-core
    build:
      context: ../..
      dockerfile: Dockerfile.vps
    env_file:
      - .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME:-1}
      JWT_REFRESH_EXPIRE_TIME: ${JWT_REFRESH_EXPIRE_TIME:-168}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      ADDRESS_REQUEST: ${ADDRESS_REQUEST:-}
      ADDRESS_VERIFY: ${ADDRESS_VERIFY:-}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
    ports:
      - "${CORE_PORT:-3001}:3001"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    networks:
      - pramool-net

  pramool-wallet-service:
    container_name: pramool-wallet-service
    build:
      context: ../../../pramool-wallet-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3102
      DATABASE_DSN: ${DATABASE_DSN}
      JWT_SECRET: ${JWT_SECRET}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY}
      OMISE_WEBHOOK_SECRET: ${OMISE_WEBHOOK_SECRET}
      OMISE_SYSTEM_RECIPIENT_ID: ${OMISE_SYSTEM_RECIPIENT_ID}
      WALLET_INTERNAL_KEY: ${WALLET_INTERNAL_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
    ports:
      - "${WALLET_PORT:-3102}:3102"
    restart: unless-stopped
    networks:
      - pramool-net

  pramool-auction-service:
    container_name: pramool-auction-service
    build:
      context: ../../../pramool-auction-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3103
      DATABASE_URL: ${AUCTION_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WALLET_API_BASE_URL: http://pramool-wallet-service:3102
      WALLET_INTERNAL_KEY: ${WALLET_INTERNAL_KEY}
      AUCTION_INTERNAL_KEY: ${AUCTION_INTERNAL_KEY}
      ESCROW_AUTO_CONFIRM_DAYS: ${ESCROW_AUTO_CONFIRM_DAYS:-14}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      PRAMOOL_UPLOAD_ROOT: /srv/pramool
    ports:
      - "${AUCTION_PORT:-3103}:3103"
    volumes:
      - uploads:/srv/pramool/uploads
    restart: unless-stopped
    depends_on:
      - pramool-wallet-service
    networks:
      - pramool-net

  postgrest:
    container_name: postgrest
    image: postgrest/postgrest:v13.0.4
    env_file:
      - .env
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_SERVER_PORT: 3000
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_OPENAPI_MODE: ${PGRST_OPENAPI_MODE:-follow-privileges}
      PGRST_DB_POOL: ${PGRST_DB_POOL:-10}
    ports:
      - "${POSTGREST_PORT:-3104}:3000"
    restart: unless-stopped
    networks:
      - pramool-net

volumes:
  uploads:

networks:
  pramool-net:
    driver: bridge
