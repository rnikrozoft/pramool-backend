version: '3.9'
services:
  db:
    container_name: db
    image: postgres:13
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - 5432:5432
    networks:
      - backend-network

  kong-migrations:
    image: kong:3.6
    depends_on:
      - db
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: db
      KONG_PG_PASSWORD: ${DATABASE_PASSWORD}
    command: kong migrations bootstrap
    networks:
      - backend-network

  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    depends_on:
      - db
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: db
      KONG_PG_PASSWORD: ${DATABASE_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"     
      - "8443:8443"     
      - "8001:8001"     
      - "8444:8444"
    networks:
      - backend-network     

  # backend:
  #   container_name: backend
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - .env
  #   ports:
  #     - "3001:3001" 
  #   restart: unless-stopped
